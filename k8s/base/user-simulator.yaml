apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-simulator
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-simulator
  template:
    metadata:
      labels:
        app: user-simulator
    spec:
      containers:
        - name: user-simulator
          image: binhdang150802/mlops-user-simulator:1.1.1
          imagePullPolicy: Always
          env:
            - name: API_URL
              value: "http://api:8000"
            - name: SIMULATION_INTERVAL
              value: "10"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"





version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  data-generator:
    build: ./data-generator
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ecommerce_db
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - DATE_RANGE_DAYS=90
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  api:
    build: ./api
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ecommerce_db
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  evidently:
    build: ./evidently
    ports:
      - "8002:8000"

  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    depends_on:
      - api

  user-simulator:
    build: ./user-simulator
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
